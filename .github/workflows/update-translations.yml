name: Update Bible Indexes

# ── Schedule ──────────────────────────────────────────────────────────────────
# Runs on the 1st of every month at 03:00 UTC.
# Also available to trigger manually from the Actions tab.
# Keeps the bundled online-index.json and offline-index.json current.
on:
  schedule:
    - cron: '0 3 1 * *'   # 1st of every month, 03:00 UTC
  workflow_dispatch:       # manual trigger

jobs:
  update:
    name: Refresh Bible indexes
    runs-on: ubuntu-latest
    permissions:
      contents: write      # needed to push updated index files

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Rebuild offline index from bundled XML files
        run: node scripts/build-offline-index.js

      - name: Fetch latest online translations from bible.helloao.org
        run: node scripts/update-online-index.js

      - name: Check for changes
        id: diff
        run: |
          git diff --quiet public/bibles/offline-index.json public/bibles/online-index.json \
            && echo "changed=false" >> "$GITHUB_OUTPUT" \
            || echo "changed=true"  >> "$GITHUB_OUTPUT"

      - name: Commit and push (only if indexes changed)
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/bibles/offline-index.json public/bibles/online-index.json
          git commit -m "chore: update bundled Bible indexes [skip ci]"
          git push
