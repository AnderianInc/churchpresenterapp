name: Update Bible Translations

# ── Schedule ──────────────────────────────────────────────────────────────────
# Runs on the 1st of every month at 03:00 UTC.
# Also available to trigger manually from the Actions tab.
# The release.yml workflow runs `npm run electron:build` which calls
# `update-translations` automatically — this monthly job just keeps the
# bundled file current between releases.
on:
  schedule:
    - cron: '0 3 1 * *'   # 1st of every month, 03:00 UTC
  workflow_dispatch:       # manual trigger

jobs:
  update:
    name: Refresh translations.json
    runs-on: ubuntu-latest
    permissions:
      contents: write      # needed to push the updated file

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch latest translations from bible.helloao.org
        run: node scripts/update-bible-translations.js

      - name: Check for changes
        id: diff
        run: |
          git diff --quiet public/bibles/translations.json \
            && echo "changed=false" >> "$GITHUB_OUTPUT" \
            || echo "changed=true"  >> "$GITHUB_OUTPUT"

      - name: Commit and push (only if translations changed)
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/bibles/translations.json
          git commit -m "chore: update bundled Bible translations [skip ci]"
          git push
