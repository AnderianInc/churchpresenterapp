name: Release

# Triggers on any tag matching v* (e.g. v1.0.0, v1.2.3-beta.1)
on:
  push:
    tags:
      - 'v*'

# Allow the workflow to create GitHub releases and upload assets
permissions:
  contents: write

jobs:
  # ── Build macOS (DMG + zip) ───────────────────────────────────────────────
  build-mac:
    name: Build macOS
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Refresh bundled Bible translations
        run: node scripts/update-bible-translations.js

      - name: Run tests
        run: npm test -- --watchAll=false --passWithNoTests --ci

      - name: Build React app
        run: npm run build

      - name: Build macOS installer
        env:
          # Code-signing (set in GitHub repo Secrets for signed production builds)
          # Leave unset for unsigned builds — the app will still run with Gatekeeper bypass.
          CSC_LINK: ${{ secrets.MAC_CERT_P12_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          # Notarization (required for Gatekeeper approval without bypass on macOS 13+)
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: npx electron-builder --mac --publish never

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mac-installers
          path: |
            dist/*.dmg
            dist/*.zip
          if-no-files-found: warn

  # ── Build Windows (NSIS installer + portable) ─────────────────────────────
  build-windows:
    name: Build Windows
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Refresh bundled Bible translations
        run: node scripts/update-bible-translations.js

      - name: Run tests
        run: npm test -- --watchAll=false --passWithNoTests --ci

      - name: Build React app
        run: npm run build

      - name: Build Windows installer
        env:
          # Code-signing (optional — requires a code-signing certificate)
          WIN_CSC_LINK: ${{ secrets.WIN_CERT_P12_BASE64 }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CERT_PASSWORD }}
        run: npx electron-builder --win --publish never

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-installers
          path: |
            dist/*.exe
          if-no-files-found: warn

  # ── Build Linux (AppImage) ────────────────────────────────────────────────
  build-linux:
    name: Build Linux
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Refresh bundled Bible translations
        run: node scripts/update-bible-translations.js

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            libgtk-3-dev \
            libnotify-dev \
            libnss3 \
            libxss1 \
            libasound2 \
            libxtst6 \
            xauth \
            xvfb

      - name: Run tests
        run: npm test -- --watchAll=false --passWithNoTests --ci

      - name: Build React app
        run: npm run build

      - name: Build Linux AppImage
        run: npx electron-builder --linux --publish never

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-installers
          path: |
            dist/*.AppImage
          if-no-files-found: warn

  # ── Create GitHub Release ─────────────────────────────────────────────────
  release:
    name: Create GitHub Release
    needs: [build-mac, build-windows, build-linux]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout (for release notes)
        uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist-all/

      - name: Collect installer files
        run: |
          mkdir -p release-assets
          find dist-all/ -type f \( -name "*.dmg" -o -name "*.zip" -o -name "*.exe" -o -name "*.AppImage" \) \
            -exec cp {} release-assets/ \;
          ls -lh release-assets/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Church Presenter ${{ github.ref_name }}
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          files: release-assets/*
          body: |
            ## Church Presenter ${{ github.ref_name }}

            Free, offline-first church presentation software for macOS, Windows, and Linux.

            ### Download

            | Platform | File |
            |---|---|
            | macOS | `Church Presenter-*.dmg` |
            | Windows | `Church Presenter Setup *.exe` |
            | Linux | `Church Presenter-*.AppImage` |

            ### First time?
            See the [Setup Guide](https://github.com/${{ github.repository }}/blob/main/docs/setup-guide.md) for installation instructions and initial configuration.

            ### What's new
            See [CHANGELOG](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md) or the auto-generated notes below.
